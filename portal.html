<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>CS Teacher Master Portal</title><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--mut:#667085;--line:#e4e7ec;--blue:#315efb;--nav:#101828}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Segoe UI,Arial,sans-serif}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101828,#243b7a);padding:20px}.box{background:#fff;border-radius:16px;padding:24px;width:min(440px,100%);box-shadow:0 18px 60px #0005}.box h1{margin:0 0 6px}.mut,.small{color:var(--mut)}.small{font-size:12px}input,select,button{padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;color:var(--ink);font:inherit}input,select{width:100%;margin:5px 0}button{cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{background:#b42318;color:#fff}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:16px;position:sticky;top:0;height:100vh}.side nav button,.side #lock{display:block;width:100%;text-align:left;background:transparent;color:#d0d5dd;border:0;margin:3px 0}.side nav button.on,.side nav button:hover{background:#ffffff18;color:#fff}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;position:sticky;top:0;z-index:3}.content{max-width:1250px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.section{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 2px 8px #00000008}.card{padding:15px;margin-bottom:14px}.kpi{font-size:26px;font-weight:800}.bar{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar input{flex:1;min-width:220px}.toolbar select{width:auto}.section{margin:12px 0;overflow:hidden}.sh{padding:13px 15px;background:#fafbfc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h2{margin:0 0 10px}table{width:100%;border-collapse:collapse}th,td{padding:9px 11px;border-bottom:1px solid #eef0f3;text-align:left;vertical-align:top}th{font-size:11px;color:var(--mut);text-transform:uppercase}.status{min-width:175px}.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:800}.aplus{background:#fee4e2;color:#b42318}.a{background:#fff0e0;color:#9a3412}.b{background:#fff2cc;color:#854d0e}.c{background:#eef0f3;color:#475467}.master{background:#f2fff6}.pyq{background:#f2f9ff}.heat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.heat>div{border:1px solid var(--line);border-radius:10px;padding:10px}.tabs{display:flex;gap:7px;flex-wrap:wrap}.tabs button{width:auto}.pill{display:inline-block;border:1px solid var(--line);border-radius:8px;padding:7px 9px;margin:3px}.alert{padding:12px;border-left:4px solid var(--blue);background:#f4f7ff;border-radius:8px}.userlist{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.userlist button{width:auto}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:10}.modal .box{max-height:90vh;overflow:auto}@media(max-width:850px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.grid,.two{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.two,.heat{grid-template-columns:1fr}.content{padding:10px}}
</style></head><body>
<div id="login" class="login"><div class="box"><h1>🎓 CS Teacher Master Portal</h1><p class="mut">DSSSB TGT CS + BPSC TRE 4.0 + Paper 1</p><div id="userButtons" class="userlist"></div><input id="username" placeholder="Profile name" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="auth" class="primary" style="width:100%">Create / Sign in</button><p id="loginMsg" class="small"></p><p class="small">Multiple local profiles are supported. Passwords are SHA-256 hashed in this browser. This is a study-profile lock, not server-side security.</p></div></div>
<div id="app" class="app hide"><aside class="side"><h3 style="margin-top:0">CS MASTER</h3><p class="small" id="who"></p><nav id="nav"><button data-page="home">🏠 Dashboard</button><button data-page="dsssb">📘 DSSSB CS</button><button data-page="d1">📝 DSSSB Paper 1</button><button data-page="bpsc">📗 BPSC CS</button><button data-page="b1">📝 BPSC Paper 1</button><button data-page="bg">🌐 BPSC GS / Prelims</button><button data-page="common">🔗 Common Core</button><button data-page="pyq">📚 PYQ Bank</button><button data-page="time">⏱ Time & Planner</button><button data-page="settings">⚙ Settings</button></nav><button id="lock">🔒 Lock / Switch User</button></aside><main class="main"><div class="top"><b id="title">Dashboard</b> <span id="clock" class="small"></span></div><div id="content" class="content"></div></main></div>
<div id="modal" class="modal hide"></div><script src="data.js?v=2"></script><script>
'use strict';
const STATUS=['⬜ Not Started','🟨 Studying','🟦 Notes Done','🟩 PYQ Done','⭐ Mastered'];
const STORE='cs-master-v9';let DB=JSON.parse(localStorage.getItem(STORE)||'{"users":{}}'),ME='',PAGE='home',timer=null,elapsed=0,lastReminder='';
const save=()=>localStorage.setItem(STORE,JSON.stringify(DB));
async function digest(s){if(window.crypto&&crypto.subtle){let b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,'0')).join('')}return btoa(unescape(encodeURIComponent(s)))}
function user(){return DB.users[ME]}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function badge(p){return String(p).toLowerCase().replace('+','plus')}
function profileButtonList(){let el=document.getElementById('userButtons'),names=Object.keys(DB.users);el.innerHTML=names.map(n=>`<button data-user="${esc(n)}">${esc(n)}</button>`).join('');el.querySelectorAll('[data-user]').forEach(b=>b.onclick=()=>{username.value=b.dataset.user;password.focus()})}
async function login(){let n=username.value.trim(),pw=password.value;if(!n||!pw){loginMsg.textContent='Enter a profile name and password.';return}let h=await digest(pw),u=DB.users[n];if(!u){DB.users[n]={hash:h,status:{},targets:{},today:0,total:0,daily:120,pyq:[],lastDay:new Date().toISOString().slice(0,10),reminderHour:20};save();ME=n;openApp();return}if(u.hash!==h){loginMsg.textContent='Incorrect password for this profile.';return}ME=n;openApp()}
function openApp(){let u=user(),d=new Date().toISOString().slice(0,10);if(u.lastDay!==d){u.today=0;u.lastDay=d;save()}login.classList.add('hide');app.classList.remove('hide');who.textContent='👤 '+ME;render()}
function lock(){if(timer){clearInterval(timer);timer=null}ME='';app.classList.add('hide');login.classList.remove('hide');password.value='';profileButtonList();loginMsg.textContent=''}
function nav(){document.querySelectorAll('[data-page]').forEach(b=>b.onclick=()=>{PAGE=b.dataset.page;document.querySelectorAll('[data-page]').forEach(x=>x.classList.toggle('on',x===b));render()});lock.onclick=lock}
function rowsFor(){return [['DSSSB CS',DATA.dsssbTech],['DSSSB Paper 1',DATA.dsssbPaper1],['BPSC CS',DATA.bpscSubject],['BPSC Prelims',DATA.bpscPrelims],['BPSC Paper 1',DATA.bpscMainPaper1],['BPSC GS',DATA.bpscMainGS]].flatMap(([e,a])=>a.flatMap(x=>x[3].map(t=>({exam:e,section:x[0],topic:t,priority:x[2],id:e+'|'+x[0]+'|'+t}))));}
function status(id){return user().status[id]||STATUS[0]}
function setStatus(id,v){user().status[id]=v;save()}
function stats(exam){let a=rowsFor().filter(x=>x.exam===exam),done=a.filter(x=>status(x.id)===STATUS[3]||status(x.id)===STATUS[4]).length,master=a.filter(x=>status(x.id)===STATUS[4]).length;return [a.length,done,master,a.length?Math.round(done/a.length*100):0]}
function priorityMap(k){let a=DATA.maps[k]||[];return `<div class="heat">${a.map(x=>`<div><span class="badge ${badge(x[2])}">${x[2]}</span><br><b>${esc(x[0])}</b><br><span class="small">${esc(x[1])}</span></div>`).join('')}</div>`}
function countdown(name,key){let t=user().targets[key];return `<div><b>${name}</b>: ${t?remaining(t):'<span class="mut">Target not set</span>'}</div>`}
function remaining(t){let x=new Date(t)-Date.now();if(x<=0)return '<b>Target reached</b>';let d=Math.floor(x/86400000);x%=86400000;let h=Math.floor(x/3600000);x%=3600000;let m=Math.floor(x/60000);return `<b>${d}d ${h}h ${m}m</b> remaining`}
function home(){let es=['DSSSB CS','DSSSB Paper 1','BPSC CS','BPSC Prelims','BPSC Paper 1','BPSC GS'],ss=es.map(stats),tot=ss.reduce((a,x)=>a+x[0],0),done=ss.reduce((a,x)=>a+x[1],0);return `<div class="grid"><div class="card">Syllabus micro-topics<div class="kpi">${tot}</div></div><div class="card">PYQ Done / Mastered<div class="kpi">${done}</div></div><div class="card">Mastered<div class="kpi">${ss.reduce((a,x)=>a+x[2],0)}</div></div><div class="card">Overall<div class="kpi">${Math.round(done/tot*100)}%</div><div class="bar"><i style="width:${done/tot*100}%"></i></div></div></div><div class="grid">${es.map((e,i)=>`<div class="card"><b>${e}</b><div class="kpi">${ss[i][3]}%</div><div class="bar"><i style="width:${ss[i][3]}%"></i></div><span class="small">${ss[i][1]}/${ss[i][0]} completed</span></div>`).join('')}</div><div class="two"><div class="card"><h2>Actual DSSSB CS priority map</h2>${priorityMap('dsssb')}</div><div class="card"><h2>BPSC CS priority map</h2>${priorityMap('bpscSubject')}</div></div><div class="two"><div class="card"><h2>Exam countdown</h2>${countdown('DSSSB','dsssb')}<br>${countdown('BPSC','bpsc')}<p class="small">Set dates in Settings.</p></div><div class="card"><h2>Today's study</h2><div class="kpi">${fmt(user().today||0)}</div><p>Target: <b>${user().daily||120} min</b></p><div class="bar"><i style="width:${Math.min(100,(user().today||0)/(user().daily||120)*100)}%"></i></div></div></div><div class="alert"><b>Study rule:</b> A+ first → A second → B/C final pass. Don't count a topic as complete until you can solve its PYQs without notes.</div>`}
function syllabus(dataKey,exam){let a=DATA[dataKey];return `<div class="card"><div class="toolbar"><input id="search" placeholder="Search topic or subtopic…"><select id="priority"><option value="">All priorities</option><option>A+</option><option>A</option><option>B</option><option>C</option></select><select id="statusFilter"><option value="">All statuses</option>${STATUS.map(x=>`<option>${x}</option>`).join('')}</select></div><p class="small"><b>Status:</b> ${STATUS.join(' → ')}</p></div>${a.map(x=>`<section class="section"><div class="sh"><b>${esc(x[0])}</b><span class="badge ${badge(x[2])}">${x[2]}</span></div><table><tr><th>Micro-topic</th><th>Priority</th><th>Status</th></tr>${x[3].map(t=>{let id=exam+'|'+x[0]+'|'+t,v=status(id);return `<tr class="topicrow ${v===STATUS[4]?'master':''} ${v===STATUS[3]?'pyq':''}" data-text="${esc((x[0]+' '+t).toLowerCase())}" data-priority="${x[2]}" data-status="${esc(v)}"><td><b>${esc(t)}</b><div class="small">⚠ ${DATA.traps[(t.length+x[0].length)%DATA.traps.length]}</div></td><td><span class="badge ${badge(x[2])}">${x[2]}</span></td><td><select class="statusSelect" data-id="${esc(id)}">${STATUS.map(s=>`<option ${s===v?'selected':''}>${s}</option>`).join('')}</select></td></tr>`}).join('')}</table></section>`}).join('')}`}
function common(){let a=new Set(DATA.dsssbTech.flatMap(x=>x[3])),b=DATA.bpscSubject.flatMap(x=>x[3]).filter(x=>a.has(x));return `<div class="card"><h2>Common Core</h2><p>Overlapping CS concepts to master once for both exams.</p><div class="heat">${b.map(x=>`<div><b>${esc(x)}</b></div>`).join('')}</div></div>`}
function pyq(){let a=user().pyq||[];return `<div class="card"><h2>PYQ Bank</h2><p class="small">Tag each question by exam, year/shift, topic, pattern and difficulty. Frequencies will be calculated from coded questions only.</p><button class="primary" id="addPyq">＋ Add PYQ</button>${a.length?`<table><tr><th>Exam</th><th>Year / Shift</th><th>Topic</th><th>Pattern</th><th>Difficulty</th></tr>${a.map(x=>`<tr><td>${esc(x.e)}</td><td>${esc(x.y)}</td><td>${esc(x.t)}</td><td>${esc(x.p)}</td><td>${esc(x.d)}</td></tr>`).join('')}</table>`:'<p class="mut">No coded PYQs yet.</p>'}</div>`}
function time(){return `<div class="grid"><div class="card"><b>Current focus block</b><div class="kpi" id="focusTimer">${fmt(elapsed)}</div><button class="primary" id="timerBtn">${timer?'Pause':'Start'}</button><button id="resetTimer">Reset block</button></div><div class="card"><b>Today</b><div class="kpi">${fmt(user().today||0)}</div></div><div class="card"><b>Total focused</b><div class="kpi">${fmt(user().total||0)}</div></div><div class="card"><b>Daily target</b><input id="dailyTarget" type="number" min="1" value="${user().daily||120}"><button id="saveDaily">Save target</button></div></div><div class="card"><h2>Time vs syllabus</h2><p>Focused time is tracked independently from syllabus status. This lets you see whether more study time is actually producing PYQ/mastery progress.</p></div>`}
function settings(){let t=user().targets||{};return `<div class="two"><div class="card"><h2>Exam dates</h2><label>DSSSB target date/time<input id="dDate" type="datetime-local" value="${(t.dsssb||'').slice(0,16)}"></label><label>BPSC target date/time<input id="bDate" type="datetime-local" value="${(t.bpsc||'').slice(0,16)}"></label><button class="primary" id="saveDates">Save dates</button></div><div class="card"><h2>Reminders</h2><p>Enable notifications, then keep the portal open for scheduled reminder checks.</p><button class="primary" id="notify">Enable notifications</button><label>Reminder hour (0–23)<input id="remHour" type="number" min="0" max="23" value="${user().reminderHour??20}"></label><button id="saveReminder">Save reminder</button><p class="small">Reminder reports exam time remaining + overall syllabus remaining.</p></div></div><div class="card"><h2>Profile</h2><p>${esc(ME)} — all study data is local to this browser.</p><button class="danger" id="deleteProfile">Delete this profile</button></div>`}
function render(){let titles={home:'Dashboard',dsssb:'DSSSB TGT Computer Science',d1:'DSSSB Paper 1',bpsc:'BPSC TRE 4.0 Computer Science',b1:'BPSC Paper 1',bg:'BPSC GS / Prelims',common:'Common Core',pyq:'PYQ Bank',time:'Time & Planner',settings:'Settings'};title.textContent=titles[PAGE];let html=PAGE==='home'?home():PAGE==='common'?common():PAGE==='pyq'?pyq():PAGE==='time'?time():PAGE==='settings'?settings():PAGE==='dsssb'?syllabus('dsssbTech','DSSSB CS'):PAGE==='d1'?syllabus('dsssbPaper1','DSSSB Paper 1'):PAGE==='bpsc'?syllabus('bpscSubject','BPSC CS'):PAGE==='b1'?syllabus('bpscMainPaper1','BPSC Paper 1'):syllabus('bpscPrelims','BPSC Prelims');content.innerHTML=html;bindPage();clock.textContent=new Date().toLocaleString()}
function bindPage(){document.querySelectorAll('.statusSelect').forEach(x=>x.onchange=()=>{setStatus(x.dataset.id,x.value);render()});let s=document.getElementById('search'),p=document.getElementById('priority'),f=document.getElementById('statusFilter');if(s&&p&&f){let filter=()=>document.querySelectorAll('.topicrow').forEach(r=>r.style.display=(!s.value||r.dataset.text.includes(s.value.toLowerCase()))&&(!p.value||r.dataset.priority===p.value)&&(!f.value||r.dataset.status===f.value)?'':'none');s.oninput=p.oninput=f.onchange=filter}let add=document.getElementById('addPyq');if(add)add.onclick=addPyq;let tb=document.getElementById('timerBtn');if(tb)tb.onclick=toggleTimer;let rt=document.getElementById('resetTimer');if(rt)rt.onclick=()=>{elapsed=0;render()};let sd=document.getElementById('saveDaily');if(sd)sd.onclick=()=>{user().daily=Math.max(1,+dailyTarget.value||120);save();render()};let sv=document.getElementById('saveDates');if(sv)sv.onclick=()=>{user().targets={dsssb:dDate.value,bpsc:bDate.value};save();render()};let nt=document.getElementById('notify');if(nt)nt.onclick=enableNotifications;let sr=document.getElementById('saveReminder');if(sr)sr.onclick=()=>{user().reminderHour=Math.max(0,Math.min(23,+remHour.value||20));save();alert('Reminder time saved.')};let del=document.getElementById('deleteProfile');if(del)del.onclick=deleteProfile}
function toggleTimer(){if(timer){clearInterval(timer);timer=null;return render()}timer=setInterval(()=>{elapsed++;user().today=(user().today||0)+1/60;user().total=(user().total||0)+1/60;save();let e=document.getElementById('focusTimer');if(e)e.textContent=fmt(elapsed);},1000);render()}
function fmt(sec){sec=Math.round(sec||0);let h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;return `${h}h ${m}m ${s}s`}
function addPyq(){let e=prompt('Exam (DSSSB/BPSC):');if(!e)return;let y=prompt('Year / shift:');let t=prompt('Topic/subtopic:');let p=prompt('Pattern (definition/output/numerical/etc.):');let d=prompt('Difficulty (Easy/Moderate/Hard):');user().pyq.push({e,y,t,p,d});save();render()}
function deleteProfile(){if(confirm('Delete '+ME+' and all local study data?')){delete DB.users[ME];save();lock();profileButtonList()}}
async function enableNotifications(){if(!('Notification'in window)){alert('This browser does not support notifications.');return}let r=await Notification.requestPermission();alert(r==='granted'?'Notifications enabled. Keep the portal open for scheduled reminder checks.':'Notification permission was not granted.')}
function reminder(){let u=user();if(!u)return;let h=new Date().getHours(),key=new Date().toISOString().slice(0,10)+'-'+h;if(h!==(u.reminderHour??20)||lastReminder===key)return;lastReminder=key;let ss=['DSSSB CS','DSSSB Paper 1','BPSC CS','BPSC Prelims','BPSC Paper 1','BPSC GS'].map(stats),total=ss.reduce((a,x)=>a+x[0],0),done=ss.reduce((a,x)=>a+x[1],0),body=`Syllabus completed: ${Math.round(done/total*100)}%. Remaining: ${total-done} micro-topics. ${u.targets.dsssb?remaining(u.targets.dsssb).replace(/<[^>]+>/g,''):''} ${u.targets.bpsc?'BPSC '+remaining(u.targets.bpsc).replace(/<[^>]+>/g,''):''}`;if('Notification'in window&&Notification.permission==='granted')new Notification('CS Study Reminder',{body});}
setInterval(()=>{if(ME){clock.textContent=new Date().toLocaleString();reminder();}},30000);
profileButtonList();document.getElementById('auth').onclick=login;document.getElementById('password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});nav();
</script></body></html>
