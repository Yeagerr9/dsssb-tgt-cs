<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache"><title>CS Teacher Master Portal</title><style>:root{--bg:#f5f7fb;--card:#fff;--ink:#172033;--mut:#667085;--line:#e4e7ec;--blue:#315efb;--nav:#101828}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Segoe UI,Arial,sans-serif}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101828,#243b7a);padding:20px}.box{background:#fff;border-radius:16px;padding:24px;width:min(440px,100%);box-shadow:0 18px 60px #0005}.box h1{margin:0 0 6px}.mut,.small{color:#667085}.small{font-size:12px}input,select,button{padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;color:#172033;font:inherit}input,select{width:100%;margin:5px 0}button{cursor:pointer}.primary{background:#315efb;border-color:#315efb;color:#fff}.danger{background:#b42318;color:#fff}.app{display:grid;grid-template-columns:235px 1fr;min-height:100vh}.side{background:#101828;color:#fff;padding:16px;position:sticky;top:0;height:100vh}.side nav button,.side #lock{display:block;width:100%;text-align:left;background:transparent;color:#d0d5dd;border:0;margin:3px 0}.side nav button:hover{background:#ffffff18;color:#fff}.main{min-width:0}.top{background:#fff;border-bottom:1px solid #e4e7ec;padding:14px 20px;position:sticky;top:0;z-index:3}.content{max-width:1250px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.card,.section{background:#fff;border:1px solid #e4e7ec;border-radius:13px;box-shadow:0 2px 8px #00000008}.card{padding:15px;margin-bottom:14px}.kpi{font-size:26px;font-weight:800}.bar{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:#315efb}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar input{flex:1;min-width:220px}.toolbar select{width:auto}.section{margin:12px 0;overflow:hidden}.sh{padding:13px 15px;background:#fafbfc;border-bottom:1px solid #e4e7ec;display:flex;justify-content:space-between;align-items:center}h2{margin:0 0 10px}table{width:100%;border-collapse:collapse}th,td{padding:9px 11px;border-bottom:1px solid #eef0f3;text-align:left;vertical-align:top}th{font-size:11px;color:#667085;text-transform:uppercase}.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:800}.aplus{background:#fee4e2;color:#b42318}.a{background:#fff0e0;color:#9a3412}.b{background:#fff2cc;color:#854d0e}.c{background:#eef0f3;color:#475467}.master{background:#f2fff6}.heat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.heat>div{border:1px solid #e4e7ec;border-radius:10px;padding:10px}.alert{padding:12px;border-left:4px solid #315efb;background:#f4f7ff;border-radius:8px}.userlist{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.userlist button{width:auto}@media(max-width:850px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.grid,.two{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.two,.heat{grid-template-columns:1fr}.content{padding:10px}}</style></head><body>
<div id="login" class="login"><div class="box"><h1>🎓 CS Teacher Master Portal</h1><p class="mut">DSSSB TGT CS + BPSC TRE 4.0 + Paper 1</p><div id="userButtons" class="userlist"></div><input id="username" placeholder="Profile name" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="auth" class="primary" style="width:100%">Create / Sign in</button><button id="resetProfile" style="width:100%;margin-top:7px">Reset / Delete Profile</button><p id="loginMsg" class="small"></p><p class="small">Profiles are stored locally in this browser. This is a study-profile lock, not server-side authentication.</p></div></div>
<div id="app" class="app hide"><aside class="side"><h3 style="margin-top:0">CS MASTER</h3><p class="small" id="who"></p><nav><button data-page="home">🏠 Dashboard</button><button data-page="dsssb">📘 DSSSB CS</button><button data-page="d1">📝 DSSSB Paper 1</button><button data-page="bpsc">📗 BPSC CS</button><button data-page="b1">📝 BPSC Paper 1</button><button data-page="bg">🌐 BPSC GS / Prelims</button><button data-page="common">🔗 Common Core</button><button data-page="pyq">📚 PYQ Bank</button><button data-page="time">⏱ Time & Planner</button><button data-page="settings">⚙ Settings</button></nav><button id="lock">🔒 Lock / Switch User</button></aside><main class="main"><div class="top"><b id="title">Dashboard</b> <span id="clock" class="small"></span></div><div id="content" class="content"></div></main></div>
<script src="data.js?v=3"></script><script src="app.js?v=1"></script></body></html>
