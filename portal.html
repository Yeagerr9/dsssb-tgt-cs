<!doctype html><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>CS Teacher Master Portal</title><style>:root{--b:#315efb;--bg:#f4f6fa;--ink:#172033;--mut:#667085;--line:#e4e7ec}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px Segoe UI,Arial}.hide{display:none}.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#101828,#315efb);padding:20px}.box,.card,section{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}.box{width:min(430px,100%)}input,select,button{padding:9px;border:1px solid #d0d5dd;border-radius:9px;background:#fff}button{cursor:pointer}.primary{background:var(--b);color:#fff;border-color:var(--b)}.danger{background:#b42318;color:#fff}.app{display:grid;grid-template-columns:230px 1fr;min-height:100vh}.side{background:#101828;color:#fff;padding:16px;position:sticky;top:0;height:100vh}.side button{display:block;width:100%;text-align:left;background:transparent;color:#d0d5dd;border:0;margin:3px 0}.side button.on,.side button:hover{background:#ffffff18;color:#fff}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:14px 20px;position:sticky;top:0;z-index:3}.content{max-width:1250px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.kpi{font-size:26px;font-weight:800}.mut{color:var(--mut)}.bar{height:8px;background:#e9edf3;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--b)}.toolbar{display:flex;gap:7px;flex-wrap:wrap;margin-bottom:10px}.toolbar input{flex:1;min-width:220px}.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:800}.aplus{background:#fee4e2;color:#b42318}.a{background:#fff0e0;color:#9a3412}.b{background:#fff2cc;color:#854d0e}.c{background:#eef0f3;color:#475467}.section{padding:0;margin:12px 0;overflow:hidden}.sh{padding:13px 15px;background:#fafbfc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between}table{width:100%;border-collapse:collapse}th,td{padding:9px 11px;border-bottom:1px solid #eef0f3;text-align:left;vertical-align:top}th{font-size:11px;color:var(--mut);text-transform:uppercase}.status{min-width:165px}.master{background:#f4fff7}.pyq{background:#f5fbff}.heat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.heat div{border:1px solid var(--line);padding:10px;border-radius:9px}.count{font-size:22px;font-weight:800}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:9}.modal>.box{max-height:90vh;overflow:auto}.small{font-size:12px}.links a{color:#315efb}@media(max-width:850px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.grid,.two{grid-template-columns:1fr 1fr}}@media(max-width:520px){.grid,.two,.heat{grid-template-columns:1fr}.content{padding:10px}}</style>
<div id=login class=login><div class=box><h1>🎓 CS Teacher Master Portal</h1><p class=mut>DSSSB TGT CS + BPSC TRE 4.0 + Paper 1</p><div id=users></div><input id=un placeholder="Profile name" autocomplete=username><input id=pw type=password placeholder="Password" autocomplete=new-password><button id=auth class=primary style="width:100%">Create / Sign in</button><p id=msg class=small mut></p><p class=small mut>Local multi-user profiles. Passwords are hashed locally; this is not server-side authentication.</p></div></div>
<div id=app class="app hide"><aside class=side><b>CS MASTER</b><p class=small id=who></p><nav><button data-p=home class=on>🏠 Dashboard</button><button data-p=dsssb>📘 DSSSB CS</button><button data-p=d1>📝 DSSSB Paper 1</button><button data-p=bpsc>📗 BPSC CS</button><button data-p=b1>📝 BPSC Paper 1</button><button data-p=bg>🌐 BPSC GS/Prelims</button><button data-p=common>🔗 Common Core</button><button data-p=pyq>📚 PYQ Bank</button><button data-p=time>⏱ Time & Planner</button><button data-p=settings>⚙ Settings</button></nav><button id=lock>🔒 Lock / Switch User</button></aside><main class=main><div class=top><b id=title>Dashboard</b> <span class=small mut id=clock></span></div><div id=content class=content></div></main></div><div id=modal class="modal hide"></div>
<script src=data.js></script><script>
const S=['⬜ Not Started','🟨 Studying','🟦 Notes Done','🟩 PYQ Done','⭐ Mastered'],K='cs-master-v8';let D=JSON.parse(localStorage.getItem(K)||'{"u":{}}'),me='',page='home',tm=null,secs=0;
const save=()=>localStorage.setItem(K,JSON.stringify(D)),P=()=>D.u[me],all=()=>{let z=[];[['DSSSB CS',DATA.dsssbTech],['DSSSB Paper 1',DATA.dsssbPaper1],['BPSC CS',DATA.bpscSubject],['BPSC Prelims',DATA.bpscPrelims],['BPSC Paper 1',DATA.bpscMainPaper1],['BPSC GS',DATA.bpscMainGS]].forEach(([e,a])=>a.forEach(x=>x[3].forEach(t=>z.push({e,s:x[0],t,p:x[2],id:e+'|'+x[0]+'|'+t}))));return z},st=id=>P().st[id]||S[0],setst=(id,v)=>{P().st[id]=v;save()},hash=async x=>[...new Uint8Array(await crypto.subtle.digest('SHA-256',new TextEncoder().encode(x)))].map(x=>x.toString(16).padStart(2,'0')).join(''),bad=p=>p.toLowerCase().replace('+','plus'),esc=x=>String(x||'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
function prog(e){let a=all().filter(x=>x.e===e),d=a.filter(x=>S.slice(3).includes(st(x.id))).length;return [a.length,d,a.filter(x=>st(x.id)===S[4]).length,a.length?Math.round(d/a.length*100):0]}
function map(k){return `<div class=heat>${(DATA.maps[k]||[]).map(x=>`<div><span class="badge ${bad(x[2])}">${x[2]}</span><br><b>${x[0]}</b><br><span class=small>${x[1]}</span></div>`).join('')}</div>`}
function home(){let es=['DSSSB CS','DSSSB Paper 1','BPSC CS','BPSC Prelims','BPSC Paper 1','BPSC GS'],q=es.map(prog),T=q.reduce((a,x)=>a+x[0],0),D1=q.reduce((a,x)=>a+x[1],0);return `<div class=grid><div class=card>Micro-topics<div class=kpi>${T}</div></div><div class=card>Completed<div class=kpi>${D1}</div></div><div class=card>Mastered<div class=kpi>${q.reduce((a,x)=>a+x[2],0)}</div></div><div class=card>Overall<div class=kpi>${Math.round(D1/T*100)}%</div><div class=bar><i style="width:${D1/T*100}%"></i></div></div></div><div class=grid>${es.map((e,i)=>`<div class=card><b>${e}</b><div class=kpi>${q[i][3]}%</div><div class=bar><i style="width:${q[i][3]}%"></i></div><span class=small mut>${q[i][1]}/${q[i][0]} complete</span></div>`).join('')}</div><div class=two><div class=card><h2>Actual priority map — DSSSB CS</h2>${map('dsssb')}</div><div class=card><h2>Actual priority map — BPSC CS</h2>${map('bpscSubject')}</div></div><div class=two><div class=card><h2>Countdowns</h2>${cd('DSSSB','dsssb')}${cd('BPSC','bpsc')}</div><div class=card><h2>Today</h2><div class=kpi>${fmt(P().today||0)}</div><p>Daily target: <b>${P().daily||120} min</b></p><button class=primary onclick="go('time')">Study now</button></div></div>`}
function cd(n,k){let t=P().targets[k];return `<p><b>${n}</b> <span id=c_${k}>${t?left(t):'Target not set'}</span></p>`}function left(t){let x=new Date(t)-Date.now();if(x<=0)return 'Target passed';let d=Math.floor(x/864e5);x%=864e5;let h=Math.floor(x/36e5);x%=36e5;let m=Math.floor(x/6e4);return `${d}d ${h}h ${m}m remaining`}
function syllabus(key,exam){let a=DATA[key];return `<div class=card><div class=toolbar><input id=search placeholder="Search topic…"><select id=pri><option value=>All priorities</option><option>A+</option><option>A</option><option>B</option><option>C</option></select><select id=sf><option value=>All statuses</option>${S.map(x=>`<option>${x}</option>`).join('')}</select></div><p class=small><b>Status:</b> ${S.join(' → ')}</p></div>`+a.map(x=>`<section class=section><div class=sh><b>${x[0]}</b><span class="badge ${bad(x[2])}">${x[2]}</span></div><table><tr><th>Micro-topic</th><th>Priority</th><th>Status</th></tr>${x[3].map(t=>{let id=exam+'|'+x[0]+'|'+t,v=st(id);return `<tr data-r data-q="${esc((x[0]+' '+t).toLowerCase())}" data-p=${x[2]} data-s="${esc(v)}" class="${v===S[4]?'master':v===S[3]?'pyq':''}"><td><b>${esc(t)}</b><div class=small mut>⚠ ${DATA.traps[Math.floor(Math.random()*DATA.traps.length)]}</div></td><td><span class="badge ${bad(x[2])}">${x[2]}</span></td><td><select class=status data-id="${esc(id)}">${S.map(s=>`<option ${s===v?'selected':''}>${s}</option>`).join('')}</select></td></tr>`}).join('')}</table></section>`).join('')}
function common(){let A=new Set(DATA.dsssbTech.flatMap(x=>x[3])),B=DATA.bpscSubject.flatMap(x=>x[3]).filter(x=>A.has(x));return `<div class=card><h2>Common Core</h2><p>Master these overlapping CS concepts once, then focus on exam-specific wording and PYQs.</p><div class=heat>${B.map(x=>`<div><b>${esc(x)}</b></div>`).join('')}</div></div>`}
function pyq(){let a=P().pyq||[];return `<div class=card><h2>PYQ Bank</h2><p>Record only identifiable questions. Frequency percentages will be calculated from tagged year/shift questions, not guessed.</p><button class=primary onclick=add()>＋ Add PYQ</button>${a.length?`<table><tr><th>Exam</th><th>Year/Shift</th><th>Topic</th><th>Pattern</th><th>Difficulty</th></tr>${a.map(x=>`<tr><td>${esc(x.e)}</td><td>${esc(x.y)}</td><td>${esc(x.t)}</td><td>${esc(x.p)}</td><td>${esc(x.d)}</td></tr>`).join('')}</table>`:'<p class=mut>No coded PYQs yet.</p>'}</div>`}
function time(){return `<div class=grid><div class=card>Current block<div class=kpi id=timer>${fmt(secs)}</div><button class=primary onclick=toggle()>${tm?'Pause':'Start'}</button></div><div class=card>Today<div class=kpi>${fmt(P().today||0)}</div></div><div class=card>Total<div class=kpi>${fmt(P().total||0)}</div></div><div class=card>Daily target<div class=kpi>${P().daily||120}m</div><input id=daily type=number value=${P().daily||120}></div></div><div class=card><h2>Time strategy</h2><p>Track focused blocks. After each block, update the topic status and log a PYQ set. The planner deliberately separates time spent from syllabus completion.</p></div>`}
function settings(){let t=P().targets||{};return `<div class=two><div class=card><h2>Exam targets</h2><label>DSSSB <input id=td type=datetime-local value="${(t.dsssb||'').slice(0,16)}"></label><br><br><label>BPSC <input id=tb type=datetime-local value="${(t.bpsc||'').slice(0,16)}"></label><br><br><button class=primary onclick=targets()>Save</button></div><div class=card><h2>Reminders</h2><p>Enable browser notifications. The portal can show a daily countdown/status reminder at your chosen hour.</p><button class=primary onclick=notify()>Enable notifications</button><br><br><label>Reminder hour <input id=rh type=number min=0 max=23 value=${P().rh??20}></label><button onclick=saveRh()>Save</button></div></div><div class=card><h2>Local profile</h2><p>${esc(me)} — data stays in this browser.</p><button class=danger onclick=del()>Delete profile</button></div>`}
function render(){let n={home:'Dashboard',dsssb:'DSSSB CS',d1:'DSSSB Paper 1',bpsc:'BPSC CS',b1:'BPSC Paper 1',bg:'BPSC GS / Prelims',common:'Common Core',pyq:'PYQ Bank',time:'Time & Planner',settings:'Settings'};title.textContent=n[page];let c=page==='home'?home():page==='common'?common():page==='pyq'?pyq():page==='time'?time():page==='settings'?settings():page==='dsssb'?syllabus('dsssbTech','DSSSB CS'):page==='d1'?syllabus('dsssbPaper1','DSSSB Paper 1'):page==='bpsc'?syllabus('bpscSubject','BPSC CS'):page==='b1'?syllabus('bpscMainPaper1','BPSC Paper 1'):syllabus('bpscPrelims','BPSC Prelims');content.innerHTML=c;document.querySelectorAll('.status').forEach(x=>x.onchange=()=>{setst(x.dataset.id,x.value);render()});let f=search,p=pri,s=sf;if(f)for(let z of [f,p,s])z.oninput=()=>document.querySelectorAll('[data-r]').forEach(r=>r.style.display=(!f.value||r.dataset.q.includes(f.value.toLowerCase()))&&(!p.value||r.dataset.p===p.value)&&(!s.value||r.dataset.s===s.value)?'':'none');clock.textContent=new Date().toLocaleString()}
function go(x){page=x;document.querySelectorAll('[data-p]').forEach(b=>b.classList.toggle('on',b.dataset.p===x));render()}function fmt(x){let h=Math.floor(x/3600),m=Math.floor(x%3600/60),s=x%60;return [h,m,s].map(z=>String(z).padStart(2,'0')).join(':')}
function toggle(){if(tm){clearInterval(tm);tm=null;let x=Math.floor(secs/60);P().today=(P().today||0)+x*60;P().total=(P().total||0)+x*60;save()}else{tm=setInterval(()=>{secs++;let e=document.getElementById('timer');if(e)e.textContent=fmt(secs)},1000)}render()}
async function authgo(){let n=un.value.trim()||(document.getElementById('ex')||{}).value||'',p=pw.value;if(!n||!p)return msg.textContent='Enter name and password.';let h=await hash(p);if(D.u[n]&&D.u[n].h!==h)return msg.textContent='Incorrect password.';if(!D.u[n])D.u[n]={h,st:{},pyq:[],targets:{},today:0,total:0,daily:120,rh:20};me=n;save();login.classList.add('hide');app.classList.remove('hide');who.textContent=n;render();remind()}
function setup(){let a=Object.keys(D.u);users.innerHTML=a.length?`<label>Existing profile</label><select id=ex>${a.map(x=>`<option>${esc(x)}</option>`).join('')}</select>`:''}function lock(){location.reload()}function targets(){P().targets={dsssb:td.value,bpsc:tb.value};save();render()}function saveRh(){P().rh=+rh.value;save()}async function notify(){if(!('Notification'in window))return alert('Notifications not supported.');alert(await Notification.requestPermission())}function remind(){setInterval(()=>{let h=new Date().getHours(),m=new Date().getMinutes();if(h==P().rh&&m<2&&Notification.permission==='granted')new Notification('CS Study Reminder',{body:`DSSSB ${P().targets.dsssb?left(P().targets.dsssb):'target not set'} • BPSC ${P().targets.bpsc?left(P().targets.bpsc):'target not set'} • Today ${Math.floor((P().today||0)/60)} min`})},60000)}
function add(){modal.classList.remove('hide');modal.innerHTML=`<div class=box><h2>Add PYQ</h2><input id=ae placeholder=Exam><input id=ay placeholder="Year / Shift"><input id=at placeholder=Topic><input id=ap placeholder=Pattern><select id=ad><option>Easy</option><option>Moderate</option><option>Hard</option></select><button class=primary onclick=saveq()>Save</button> <button onclick="modal.classList.add('hide')">Cancel</button></div>`}function saveq(){P().pyq.push({e:ae.value,y:ay.value,t:at.value,p:ap.value,d:ad.value});save();modal.classList.add('hide');render()}function del(){if(confirm('Delete this profile and all local progress?')){delete D.u[me];save();location.reload()}}
 document.querySelectorAll('[data-p]').forEach(b=>b.onclick=()=>go(b.dataset.p));auth.onclick=authgo;lock.onclick=lock;setup();setInterval(()=>{clock.textContent=new Date().toLocaleString();if(page==='home'){['dsssb','bpsc'].forEach(k=>{let e=document.getElementById('c_'+k);if(e&&P().targets[k])e.textContent=left(P().targets[k])})}},60000);
</script>
