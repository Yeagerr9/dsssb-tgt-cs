<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1224"><meta http-equiv="Cache-Control" content="no-cache"><title>CS Teacher Master Portal</title><style>:root{--bg:#f4f7fb;--card:#fff;--ink:#172033;--mut:#667085;--line:#e4e7ec;--blue:#315efb;--nav:#0b1224;--good:#039855;--warn:#dc6803;--bad:#d92d20}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Segoe UI,Arial,sans-serif}.hide{display:none!important}.login{min-height:100vh;display:grid;place-items:center;background:radial-gradient(circle at 20% 20%,#315efb55,transparent 35%),linear-gradient(135deg,#0b1224,#20366e);padding:20px}.box{background:#fff;border-radius:18px;padding:28px;width:min(470px,100%);box-shadow:0 22px 70px #0007}.box h1{margin:0 0 6px;font-size:25px}.mut,.small{color:var(--mut)}.small{font-size:12px}.tabs{display:flex;gap:6px;margin:14px 0}.tabs button{flex:1}input,select,button,textarea{padding:10px;border:1px solid #d0d5dd;border-radius:9px;background:#fff;color:var(--ink);font:inherit}input,select,textarea{width:100%;margin:5px 0}button{cursor:pointer}.primary{background:var(--blue);border-color:var(--blue);color:#fff}.danger{background:#b42318;border-color:#b42318;color:#fff}.app{display:grid;grid-template-columns:245px 1fr;min-height:100vh}.side{background:var(--nav);color:#fff;padding:16px;position:sticky;top:0;height:100vh;overflow:auto}.side nav button,.side #lock{display:block;width:100%;text-align:left;background:transparent;color:#d0d5dd;border:0;margin:3px 0}.side nav button.on,.side nav button:hover{background:#ffffff18;color:#fff}.side .group{font-size:10px;color:#98a2b3;text-transform:uppercase;margin:16px 8px 5px}.main{min-width:0}.top{background:#fff;border-bottom:1px solid var(--line);padding:13px 20px;position:sticky;top:0;z-index:3;display:flex;justify-content:space-between}.content{max-width:1450px;margin:auto;padding:18px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.three{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.card,.section{background:var(--card);border:1px solid var(--line);border-radius:13px;box-shadow:0 2px 8px #00000008}.card{padding:15px;margin-bottom:14px}.kpi{font-size:27px;font-weight:800}.bar{height:8px;background:#e9edf3;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--blue)}.bar.good i{background:var(--good)}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:10px}.toolbar input{flex:1;min-width:220px}.toolbar select{width:auto}.section{margin:12px 0;overflow:hidden}.sh{padding:13px 15px;background:#fafbfc;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}h2{margin:0 0 10px}h3{margin-top:0}table{width:100%;border-collapse:collapse}th,td{padding:9px 11px;border-bottom:1px solid #eef0f3;text-align:left;vertical-align:top}th{font-size:11px;color:var(--mut);text-transform:uppercase}.badge{display:inline-block;padding:3px 8px;border-radius:99px;font-size:11px;font-weight:800}.aplus{background:#fee4e2;color:#b42318}.a{background:#fff0e0;color:#9a3412}.b{background:#fff2cc;color:#854d0e}.c{background:#eef0f3;color:#475467}.master{background:#f2fff6}.weak{background:#fff5f5}.heat{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.heat>div{border:1px solid var(--line);border-radius:10px;padding:10px}.alert{padding:12px;border-left:4px solid var(--blue);background:#f4f7ff;border-radius:8px;margin-bottom:12px}.success{border-left-color:var(--good);background:#effaf3}.warning{border-left-color:var(--warn);background:#fffaeb}.dangerbox{border-left-color:var(--bad);background:#fff5f5}.userlist{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}.userlist button{width:auto}.statrow{display:flex;justify-content:space-between;gap:12px;margin:7px 0}.mini{font-size:11px;padding:3px 6px;border-radius:6px;background:#f2f4f7}.modal{position:fixed;inset:0;background:#0008;display:grid;place-items:center;padding:15px;z-index:10}.modal .box{max-height:90vh;overflow:auto}.split{display:flex;justify-content:space-between;align-items:center;gap:10px}@media(max-width:950px){.app{grid-template-columns:1fr}.side{height:auto;position:static}.grid,.two,.three{grid-template-columns:1fr 1fr}}@media(max-width:600px){.grid,.two,.three,.heat{grid-template-columns:1fr}.content{padding:10px}.top{padding:12px}.side{padding:10px}}</style></head><body><div id="login" class="login"><div class="box"><h1>🎓 CS Teacher Master Portal</h1><p class="mut">DSSSB TGT CS • BPSC TRE 4.0 • Paper 1 • Analytics</p><div class="tabs"><button id="localTab">Local profile</button><button id="cloudTab">Cloud account</button></div><div id="localAuth"><div id="userButtons" class="userlist"></div><input id="username" placeholder="Profile name" autocomplete="username"><input id="password" type="password" placeholder="Password" autocomplete="current-password"><button id="auth" class="primary" style="width:100%">Create / Sign in</button><button id="resetProfile" style="width:100%;margin-top:7px">Reset / Delete Profile</button></div><div id="cloudAuth" class="hide"><input id="email" type="email" placeholder="Email address" autocomplete="email"><input id="cloudPassword" type="password" placeholder="Password" autocomplete="current-password"><input id="cloudName" placeholder="Display name (new account)"><div class="two"><button id="cloudSignIn" class="primary">Sign in</button><button id="cloudSignUp">Create account</button></div><button id="cloudReset" style="width:100%;margin-top:7px">Forgot password</button></div><p id="loginMsg" class="small"></p><p id="cloudState" class="small"></p><p class="small">Local mode works immediately. Cloud mode is optional and uses Firebase Authentication + Firestore after configuration.</p></div></div><div id="app" class="app hide"><aside class="side"><h3>CS MASTER</h3><p class="small" id="who"></p><div class="group">Overview</div><nav><button data-page="home">🏠 Dashboard</button><button data-page="analytics">📊 Analytics</button><button data-page="planner">🎯 Smart Planner</button></nav><div class="group">DSSSB</div><nav><button data-page="dsssb">📘 TGT Computer Science</button><button data-page="d1">📝 Paper 1</button></nav><div class="group">BPSC TRE 4.0</div><nav><button data-page="bpsc">📗 Computer Science</button><button data-page="b1">📝 Paper 1</button><button data-page="bg">🌐 GS / Prelims</button></nav><div class="group">Tools</div><nav><button data-page="common">🔗 Common Core</button><button data-page="pyq">📚 PYQ Bank</button><button data-page="time">⏱ Time & Sessions</button><button data-page="settings">⚙ Settings</button></nav><button id="lock">🔒 Lock / Switch User</button></aside><main class="main"><div class="top"><b id="title">Dashboard</b><span id="clock" class="small"></span></div><div id="content" class="content"></div></main></div><div id="modal" class="modal hide"></div><script src="firebase-config.js?v=1"></script><script src="data.js?v=4"></script><script src="app.js?v=10"></script><script type="module" src="firebase-cloud.js?v=1"></script></body></html>
